packages:
  - 'packages/*'

# Required by non-legacy `pnpm deploy` (used in the Docker build). Causes
# workspace deps to be hard-linked into each package's node_modules instead
# of symlinked, which is what deploy needs to produce a portable tree.
injectWorkspacePackages: true

allowBuilds:
  es5-ext: true
  lefthook: true
  esbuild: true
  protobufjs: true

blockExoticSubdeps: false

patchedDependencies:
  steam-crypto@0.0.1: patches/steam-crypto@0.0.1.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b
  vite-plus: 0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-darwin-x64@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b'
  - vite-plus@0.0.0-commit.8b23a00f98df4a9270ac87a4f80b2ce1b669040b
