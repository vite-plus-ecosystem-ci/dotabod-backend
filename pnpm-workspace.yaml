packages:
  - "packages/*"

# Required by non-legacy `pnpm deploy` (used in the Docker build). Causes
# workspace deps to be hard-linked into each package's node_modules instead
# of symlinked, which is what deploy needs to produce a portable tree.
injectWorkspacePackages: true

allowBuilds:
  es5-ext: true
  lefthook: true
  esbuild: true
  protobufjs: true

blockExoticSubdeps: false

patchedDependencies:
  steam-crypto@0.0.1: patches/steam-crypto@0.0.1.patch
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@tsrs/darwin-arm64@7.1.0-beta.tsrs2"
  - "@tsrs/darwin-x64@7.1.0-beta.tsrs2"
  - "@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs2"
  - "@tsrs/linux-arm64-musl@7.1.0-beta.tsrs2"
  - "@tsrs/linux-x64-gnu@7.1.0-beta.tsrs2"
  - "@tsrs/linux-x64-musl@7.1.0-beta.tsrs2"
  - "@tsrs/win32-arm64@7.1.0-beta.tsrs2"
  - "@tsrs/win32-x64@7.1.0-beta.tsrs2"
  - tsrs@7.1.0-beta.tsrs2
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440
  vite-plus: 0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
