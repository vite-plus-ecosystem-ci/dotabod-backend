packages:
  - 'packages/*'

# Required by non-legacy `pnpm deploy` (used in the Docker build). Causes
# workspace deps to be hard-linked into each package's node_modules instead
# of symlinked, which is what deploy needs to produce a portable tree.
injectWorkspacePackages: true

allowBuilds:
  es5-ext: true
  lefthook: true
  esbuild: true
  protobufjs: true

blockExoticSubdeps: false

patchedDependencies:
  steam-crypto@0.0.1: patches/steam-crypto@0.0.1.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.9855245a469b178066c25a5d45c971c130565d89
  vite-plus: 0.0.0-commit.9855245a469b178066c25a5d45c971c130565d89
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@oxc-project/runtime@0.141.0'
  - '@oxc-project/types@0.141.0'
  - '@oxfmt/binding-android-arm-eabi@0.60.0'
